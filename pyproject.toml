[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-bench"
version = "0.1.0"
description = "Reproducible, quality-aware benchmarks for OpenAI-compatible local inference servers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Inference Bench contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
inference-bench = "inference_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
